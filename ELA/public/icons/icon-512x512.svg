<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="50%" stop-color="#082b21" />
      <stop offset="100%" stop-color="#02130e" />
    </linearGradient>

    <!-- Green Emerald Ribbon Gradient -->
    <linearGradient id="emeraldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Royal Gold Ribbon Gradient -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle border outline -->
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="url(#goldRibbon)" stroke-width="2" opacity="0.35" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="230" r="170" fill="#10b981" opacity="0.08" filter="url(#glow)" />
  <circle cx="256" cy="230" r="100" fill="#f59e0b" opacity="0.06" filter="url(#glow)" />

  <!-- The Luxury Ribbon Emblem (Option 3 Design) -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Main Ribbon Paths forming E - L - A -->
    
    <!-- Letter E / First Curve (Green Emerald Base) -->
    <path d="M 120 280 C 100 240, 100 180, 150 140 C 190 110, 240 120, 250 160 C 260 200, 220 225, 180 225 L 240 225 C 255 225, 260 245, 245 260 C 230 275, 200 280, 170 280 Z" 
          fill="url(#emeraldRibbon)" />
          
    <!-- Gold Ribbon Layer for E Accent -->
    <path d="M 150 140 C 190 110, 240 120, 250 160 C 230 145, 180 140, 140 170 C 120 185, 115 210, 115 240 C 105 210, 115 165, 150 140 Z" 
          fill="url(#goldRibbon)" />

    <!-- Connecting Fluid Ribbon to L & A (Middle Flow) -->
    <path d="M 230 165 C 245 220, 245 270, 270 280 C 295 290, 320 275, 335 240 L 335 280 C 310 295, 275 290, 255 265 C 235 240, 235 190, 230 165 Z" 
          fill="url(#emeraldRibbon)" />

    <!-- Letter A (Right Ribbon Structure) -->
    <path d="M 320 280 C 340 230, 360 170, 385 140 C 405 115, 435 130, 430 165 C 425 200, 395 240, 360 280 Z" 
          fill="url(#emeraldRibbon)" />

    <!-- Gold Ribbon Arc for A Arch & Swash -->
    <path d="M 385 140 C 405 115, 435 130, 430 165 C 410 175, 375 205, 340 245 C 330 215, 355 170, 385 140 Z" 
          fill="url(#goldRibbon)" />

    <!-- Dynamic Gold Crossbar / Swash across ELA -->
    <path d="M 130 225 C 190 225, 270 200, 340 225 C 380 240, 415 230, 440 200 C 420 225, 380 255, 330 240 C 270 220, 190 245, 130 225 Z" 
          fill="url(#goldRibbon)" filter="url(#glow)" />
          
    <!-- Small Luxury Leaf Accent at the tail of A -->
    <path d="M 430 165 C 445 155, 460 160, 455 180 C 445 185, 435 180, 430 165 Z" 
          fill="url(#goldRibbon)" />
  </g>

  <!-- Typography: ELA -->
  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="10" 
        fill="#FFFFFF">
    ELA
  </text>

  <!-- Subtitle: GROUP / SMART PLATFORM -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="18" 
        font-weight="600" 
        letter-spacing="8" 
        fill="#D4AF37" 
        opacity="0.9">
    صديقك وخبير مزرعتك
  </text>
</svg>
