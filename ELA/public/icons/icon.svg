<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="50%" stop-color="#082b21" />
      <stop offset="100%" stop-color="#02130e" />
    </linearGradient>

    <linearGradient id="emeraldRibbonIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="goldRibbonIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGradIcon)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="url(#goldRibbonIcon)" stroke-width="2" opacity="0.35" />

  <circle cx="256" cy="230" r="170" fill="#10b981" opacity="0.08" filter="url(#glowIcon)" />
  <circle cx="256" cy="230" r="100" fill="#f59e0b" opacity="0.06" filter="url(#glowIcon)" />

  <g filter="url(#dropShadowIcon)" transform="translate(0, -10)">
    <path d="M 120 280 C 100 240, 100 180, 150 140 C 190 110, 240 120, 250 160 C 260 200, 220 225, 180 225 L 240 225 C 255 225, 260 245, 245 260 C 230 275, 200 280, 170 280 Z" fill="url(#emeraldRibbonIcon)" />
    <path d="M 150 140 C 190 110, 240 120, 250 160 C 230 145, 180 140, 140 170 C 120 185, 115 210, 115 240 C 105 210, 115 165, 150 140 Z" fill="url(#goldRibbonIcon)" />
    <path d="M 230 165 C 245 220, 245 270, 270 280 C 295 290, 320 275, 335 240 L 335 280 C 310 295, 275 290, 255 265 C 235 240, 235 190, 230 165 Z" fill="url(#emeraldRibbonIcon)" />
    <path d="M 320 280 C 340 230, 360 170, 385 140 C 405 115, 435 130, 430 165 C 425 200, 395 240, 360 280 Z" fill="url(#emeraldRibbonIcon)" />
    <path d="M 385 140 C 405 115, 435 130, 430 165 C 410 175, 375 205, 340 245 C 330 215, 355 170, 385 140 Z" fill="url(#goldRibbonIcon)" />
    <path d="M 130 225 C 190 225, 270 200, 340 225 C 380 240, 415 230, 440 200 C 420 225, 380 255, 330 240 C 270 220, 190 245, 130 225 Z" fill="url(#goldRibbonIcon)" filter="url(#glowIcon)" />
    <path d="M 430 165 C 445 155, 460 160, 455 180 C 445 185, 435 180, 430 165 Z" fill="url(#goldRibbonIcon)" />
  </g>

  <text x="256" y="380" text-anchor="middle" font-family="'Cairo', 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="10" fill="#FFFFFF">
    ELA
  </text>
</svg>
